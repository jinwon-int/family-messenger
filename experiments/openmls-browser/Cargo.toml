[package]
name = "family-mls-browser-experiment"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
openmls = { version = "=0.9.0", default-features = false, features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde"] }
wasm-bindgen = "=0.2.126"
# RustCrypto's older rand_core also requires the browser entropy backend.
getrandom = { version = "=0.2.17", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
