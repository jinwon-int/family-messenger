<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가족 대화 · 암호화 시험</title><link rel="stylesheet" href="/chat.css">
<body><main><h1>가족 대화</h1><p class="notice">암호화 기능 시험 화면입니다. 생성한 시험 계정·문자·8 KiB 이하 파일만 사용하세요. 실제 가족용 키 보호와 복구는 아직 제공하지 않습니다.</p>
<p id="identity">계정 확인 전</p><form id="open-form"><label>시험 대화방 <input id="room" value="family" maxlength="32" pattern="[a-zA-Z0-9_-]{1,32}" required></label><button id="open">연결 / 다시 확인</button></form>
<p id="status" role="status">연결을 눌러 주세요.</p>
<section id="device" hidden><h2>기기 확인</h2><p>내 공개 기기 지문</p><output id="fingerprint"></output><p id="pin-note">별도로 전달받은 두 기기의 지문을 입력하세요. 서버 목록만으로 기기를 신뢰하지 않습니다.</p><form id="pin-form"><label>앨리스 지문 <input id="alice-pin" maxlength="64" pattern="[a-f0-9]{64}" required autocomplete="off"></label><label>밥 지문 <input id="bob-pin" maxlength="64" pattern="[a-f0-9]{64}" required autocomplete="off"></label><button>두 지문 확인</button></form><button id="join" disabled>시험 대화 연결</button></section>
<section id="chat" hidden><h2>암호화 대화</h2><p id="phase"></p><ol id="messages"></ol><p id="pending" role="status"></p><button id="retry" hidden>저장된 전송 다시 확인</button><form id="send-form"><label>문자 <textarea id="text" maxlength="8192" rows="3"></textarea></label><label>작은 파일 <input id="file" type="file"></label><button id="send" disabled>암호화하여 보내기</button></form><p>파일은 실행·미리보기 없이 내려받습니다. 사진·영상 재생은 아직 지원하지 않습니다.</p></section>
</main><script type="module" src="/chat.js"></script></body></html>
