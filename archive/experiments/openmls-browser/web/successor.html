<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기기 교체 · 가족 대화</title><link rel="stylesheet" href="/successor-ui.css"><script type="module" src="/successor-ui.js"></script>
<main><p class="eyebrow">가족 대화 · 격리 시험 화면</p><h1>기기 교체 요청 관리</h1><p>이 기기에 이미 보관된 교체 요청을 선택하세요. 대화 참여에는 상대방의 동의와 관리자 승인이 필요합니다.</p>
<form id="lifecycle-form"><label for="scope">대화와 기기</label><select id="scope" required><option value="">준비된 요청을 선택하세요</option></select><p id="selection">준비된 요청이 없습니다.</p>
<label for="action">할 일</label><select id="action" required><option value="">작업을 선택하세요</option><option value="enrollment-observe">참여 상태 확인</option><option value="enroll">이 대화 참여에 동의</option><option value="closure-observe">종료 상태 확인</option><option value="closure-close">이 대화 종료</option></select>
<p id="effect"></p><label for="password">이 기기의 보관함 비밀번호</label><input id="password" type="password" autocomplete="off" required maxlength="1024"><label id="consent-row" hidden><input id="consent" type="checkbox">선택한 대화와 작업을 확인했고 동의합니다.</label>
<div class="buttons"><button id="run" type="submit" disabled>선택한 작업 실행</button><button id="lock" type="button">잠그기</button></div></form>
<p id="status" role="status" aria-live="polite" data-state="idle">대화와 작업을 선택하세요.</p><p class="note">이 화면은 특정 대화의 권한을 관리합니다. 새 기기의 전체 등록이나 기존 가족챗 전환을 완료하지 않습니다.</p></main></html>
