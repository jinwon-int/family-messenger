[package]
name = "native-mls-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-neutral pieces of the native-mls v2 client: relay wire types and client, minimal HTTP/1.1, base64, commit policy (#366)."

# #366: split out of native-mls-bot so the bot and the Android app (#338, uniffi Kotlin)
# share one implementation. iOS keeps its Swift core (#271 frozen contract).
# Same pinned versions as the bot (#177 principle 5: exact pins, no new dependencies).

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Key-package refs are caller-chosen opaque strings; `api::ref_hex` pins sha256 hex (same pin as the bot).
sha2 = "=0.10.9"
