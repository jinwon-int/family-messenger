# #354 A3 — 기존 native-relay-bot.service 에 얹는 drop-in(/etc/systemd/system/native-relay-bot.service.d/30-agent.conf).
# ExecStart 은 바꾸지 않는다 — 환경변수로 에이전트 모드를 켠다. 되돌리기 = 이 파일 삭제 + daemon-reload + 재시작(승인 항목).
[Unit]
# 소켓이 먼저 있어야 봇이 접속한다(연결 실패 = 봇 시작 실패 → Restart=on-failure 가 10초 뒤 재시도).
Requires=native-responder.socket
After=native-responder.socket

[Service]
Environment=NATIVE_MLS_BOT_RESPONDER_UNIX=/run/native-responder/responder.sock
Environment=NATIVE_MLS_BOT_OWNER_ACTOR=owner
