# #372 P3 — 단일 방 세션을 steward(다중 방 + 명령 큐)로 바꾸는 drop-in
# (/etc/systemd/system/native-relay-bot.service.d/40-steward.conf). 30-agent.conf(응답기 소켓)는 그대로 둔다.
#
# 선행(1회, 봇 사용자로): 기존 상태 파일에서 신원 분리 + 방 상태를 rooms 디렉터리로 옮긴다.
#   runuser -u native-relay-bot -- /opt/native-relay-bot/bin/native-mls-bot extract-identity family-acc bot-gongmyoung \
#       --state-file /var/lib/native-relay-bot/bot/state.json --identity-file /var/lib/native-relay-bot/bot/identity.json
#   install -d -o native-relay-bot -g native-relay-bot -m 0700 /var/lib/native-relay-bot/rooms
#   cp -p /var/lib/native-relay-bot/bot/state.json /var/lib/native-relay-bot/rooms/family-acc.state   # 원본은 백업으로 남긴다
#   echo agent > /var/lib/native-relay-bot/rooms/family-acc.mode                                       # 기존 방만 응답
# 되돌리기 = 이 파일 삭제 + daemon-reload + 재시작(원본 state.json 이 그대로 이어진다).
[Service]
ExecStart=
ExecStart=/opt/native-relay-bot/bin/native-mls-bot http://100.88.73.41:18921 steward bot-gongmyoung \
    --identity-file /var/lib/native-relay-bot/bot/identity.json \
    --rooms-dir /var/lib/native-relay-bot/rooms \
    --access-jwt-file /var/lib/native-relay-bot/bot/jwt
Environment=NATIVE_MLS_BOT_MAX_SECS=0
