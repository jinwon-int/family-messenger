# 의존 핀(#177 원칙 5). 호환: KGP 2.1.20 ↔ Gradle 7.6.3–8.12.1(kotlinlang gradle-configure-project 표; AGP 는 8.7.2 까지 「완전 지원」, 그 위는 「최신까지 사용 가능」).
# AGP 8.10.1 = API 36 을 지원하는 첫 안정 계열(8.7–8.9 는 최대 API 35) — 최소 Gradle 8.11.1 · Build Tools 35.0.0 · JDK 17(AGP 8.10.0 릴리스 노트). CI 는 Gradle 8.11.1 · JDK 17 그대로(#584 Play 출시).
[versions]
agp = "8.10.1"
kotlin = "2.1.20"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
coroutines = "1.9.0"
jna = "5.17.0"
okhttp = "4.12.0"
browser = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
