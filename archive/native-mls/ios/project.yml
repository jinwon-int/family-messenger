# XcodeGen — `xcodegen generate` 로 FamilyChat.xcodeproj 생성(생성물 커밋 금지).
# 한데(앱 이름, 2026-10-13 오너 확정; 코드명 FamilyChat) iOS(독자 E2EE, #271): ../ios-ffi/build-xcframework.sh 산출물 + FamilyMLSCore 계약 패키지를 링크한 SwiftUI 앱.
# 서명 없음(CI). 파이널라이저 소유(CONTRACTS.md §0).
name: FamilyChat
options:
  bundleIdPrefix: com.seoyoon-family
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  FamilyMLSCore:
    path: FamilyMLSCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    # 버전은 빌드 설정이 단일 출처: 릴리스 워크플로가 xcodebuild 인자로 MARKETING_VERSION(입력)·CURRENT_PROJECT_VERSION(run_number)을 준다.
    # 두 타깃의 Info.plist 가 아래 두 값을 $(…) 로 참조해야 한다 — xcodegen 은 info.properties 에 키가 없으면 CFBundleVersion "1" 을
    # 리터럴로 써서 인자가 무시된다(run 38372256608: 'bundle version must be higher than the previously uploaded version: 1').
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FamilyChat:
    type: application
    platform: iOS
    sources:
      - path: FamilyChat
      # uniffi 가 생성한 Swift 바인딩(빌드 산출물, 커밋하지 않음)
      - path: ../ios-ffi/out/swift/FamilyMLS.swift
        group: Generated
    dependencies:
      - framework: ../ios-ffi/out/FamilyMLS.xcframework
        embed: false
      - package: FamilyMLSCore
      # 알림 확장(§12-D) — 앱 번들 PlugIns/ 에 들어간다
      - target: FamilyChatNSE
    info:
      path: FamilyChat/Info.plist
      properties:
        CFBundleDisplayName: 한데
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 수출 규정(암호화) 답변을 빌드에 싣는다 — 없으면 ASC 가 빌드마다 MISSING_EXPORT_COMPLIANCE 로 TestFlight 배포를 멈추고
        # 사람이 답해야 한다(build 9, 2026-10-13: API 로 usesNonExemptEncryption=false 설정 후 배포). 값은 build 1·9 에 오너가 준 답과 같다:
        # 앱의 E2EE(MLS)는 표준 암호화(App Store 면제 범주)만 쓰고 독자 암호 알고리즘은 없다.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # 실제 호스트명·App Group 은 리포에 두지 않는다(CONTRIBUTING) — 빌드 설정으로 주입. 비면 앱이 안내한다.
        FamilyChatRelayURL: $(FC_RELAY_URL)
        FamilyChatAppGroup: $(FC_APP_GROUP)
        # APNs topic(= 이 앱의 Bundle ID, §12-D). 릴레이 -apns-topics 허용목록과 같아야 한다.
        FamilyChatPushTopic: $(FC_PUSH_TOPIC)
    # 서명 빌드용 자리(오너가 Team·프로비저닝을 붙일 때). 무서명 CI(CODE_SIGNING_ALLOWED=NO)에서는 적용되지 않는다.
    # aps-environment 는 개발 빌드 = development(릴레이 -apns-host 샌드박스), TestFlight·배포 = production.
    entitlements:
      path: FamilyChat/FamilyChat.entitlements
      properties:
        aps-environment: $(FC_APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(FC_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seoyoon-family.hande
        TARGETED_DEVICE_FAMILY: "1"
        # 앱 아이콘: Assets.xcassets/AppIcon(단일 1024 PNG, Xcode 가 크기 생성). App Store Connect 업로드 필수(run 38354223649 'Missing required icon file').
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 릴리스 수동 서명 자리(native-mls-ios-release.yml 이 xcodebuild 인자로 채움). 비면 무서명 CI 와 동일.
        PROVISIONING_PROFILE_SPECIFIER: $(FC_PROFILE_APP)
        FC_PROFILE_APP: ""
        FC_RELAY_URL: ""
        FC_APP_GROUP: ""
        FC_PUSH_TOPIC: $(PRODUCT_BUNDLE_IDENTIFIER)
        FC_APS_ENVIRONMENT: development
        # 정적 라이브러리 + 헤더 모듈맵: 모듈 검색 경로를 xcframework 헤더로
        OTHER_LDFLAGS: ["-lc++"]
  # 알림 확장(NSE, §12-D · #271 §8): 앱과 같은 App Group 의 MLS 상태·messages.db 를 같은 flock 규칙으로 열어
  # 푸시(room·seq)를 복호화해 알림을 바꾼다. 처리 코드는 앱 소스를 그대로 공유한다(아래 개별 파일 — UIKit 의존 없음).
  # Bundle ID 는 앱 ID 의 하위(…ios.nse), App Group·릴레이 주소는 앱과 **같은 값**을 빌드 설정으로 준다(xcodebuild 인자·xcconfig).
  FamilyChatNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: FamilyChatNSE
      - path: FamilyChat/Push/NotificationProcessor.swift
      - path: FamilyChat/Sync/SharedStorage.swift
      - path: FamilyChat/Sync/SeededEngineFactory.swift
      - path: FamilyChat/Engine/FfiEngine.swift
      - path: FamilyChat/Engine/DeviceIdentity.swift
      - path: FamilyChat/App/Strings.swift
      - path: ../ios-ffi/out/swift/FamilyMLS.swift
        group: Generated
    dependencies:
      - framework: ../ios-ffi/out/FamilyMLS.xcframework
        embed: false
      - package: FamilyMLSCore
    info:
      path: FamilyChatNSE/Info.plist
      properties:
        CFBundleDisplayName: 한데 알림
        CFBundleDevelopmentRegion: ko
        # 확장의 버전은 앱과 같아야 한다(ASC 검증) — 같은 빌드 설정을 참조.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        FamilyChatRelayURL: $(FC_RELAY_URL)
        FamilyChatAppGroup: $(FC_APP_GROUP)
        # 봇 actor(쉼표 구분) — 알림 제목에 🤖
        FamilyChatAgentActors: $(FC_AGENT_ACTORS)
    # 서명 빌드용 자리 — 무서명 CI 에는 적용되지 않는다.
    entitlements:
      path: FamilyChatNSE/FamilyChatNSE.entitlements
      properties:
        com.apple.security.application-groups: [$(FC_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seoyoon-family.hande.nse
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(FC_PROFILE_NSE)
        FC_PROFILE_NSE: ""
        FC_RELAY_URL: ""
        FC_APP_GROUP: ""
        FC_AGENT_ACTORS: ""
        OTHER_LDFLAGS: ["-lc++"]
  FamilyChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamilyChatTests
    dependencies:
      - target: FamilyChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seoyoon-family.hande.tests
schemes:
  FamilyChat:
    build:
      targets:
        FamilyChat: all
        FamilyChatTests: [test]
    test:
      config: Debug
      targets: [FamilyChatTests]
