# XcodeGen — `xcodegen generate` 로 FamilyChat.xcodeproj 생성(생성물 커밋 금지).
# 패밀리챗 iOS(독자 E2EE, #271): ../ios-ffi/build-xcframework.sh 산출물 + FamilyMLSCore 계약 패키지를 링크한 SwiftUI 앱.
# 서명 없음(CI). 파이널라이저 소유(CONTRACTS.md §0).
name: FamilyChat
options:
  bundleIdPrefix: com.example.familychat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  FamilyMLSCore:
    path: FamilyMLSCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  FamilyChat:
    type: application
    platform: iOS
    sources:
      - path: FamilyChat
      # uniffi 가 생성한 Swift 바인딩(빌드 산출물, 커밋하지 않음)
      - path: ../ios-ffi/out/swift/FamilyMLS.swift
        group: Generated
    dependencies:
      - framework: ../ios-ffi/out/FamilyMLS.xcframework
        embed: false
      - package: FamilyMLSCore
      # 알림 확장(§12-D) — 앱 번들 PlugIns/ 에 들어간다
      - target: FamilyChatNSE
    info:
      path: FamilyChat/Info.plist
      properties:
        CFBundleDisplayName: 패밀리챗
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        # 실제 호스트명·App Group 은 리포에 두지 않는다(CONTRIBUTING) — 빌드 설정으로 주입. 비면 앱이 안내한다.
        FamilyChatRelayURL: $(FC_RELAY_URL)
        FamilyChatAppGroup: $(FC_APP_GROUP)
        # APNs topic(= 이 앱의 Bundle ID, §12-D). 릴레이 -apns-topics 허용목록과 같아야 한다.
        FamilyChatPushTopic: $(FC_PUSH_TOPIC)
    # 서명 빌드용 자리(오너가 Team·프로비저닝을 붙일 때). 무서명 CI(CODE_SIGNING_ALLOWED=NO)에서는 적용되지 않는다.
    # aps-environment 는 개발 빌드 = development(릴레이 -apns-host 샌드박스), TestFlight·배포 = production.
    entitlements:
      path: FamilyChat/FamilyChat.entitlements
      properties:
        aps-environment: $(FC_APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(FC_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familychat.ios
        TARGETED_DEVICE_FAMILY: "1"
        FC_RELAY_URL: ""
        FC_APP_GROUP: ""
        FC_PUSH_TOPIC: $(PRODUCT_BUNDLE_IDENTIFIER)
        FC_APS_ENVIRONMENT: development
        # 정적 라이브러리 + 헤더 모듈맵: 모듈 검색 경로를 xcframework 헤더로
        OTHER_LDFLAGS: ["-lc++"]
  # 알림 확장(NSE, §12-D · #271 §8): 앱과 같은 App Group 의 MLS 상태·messages.db 를 같은 flock 규칙으로 열어
  # 푸시(room·seq)를 복호화해 알림을 바꾼다. 처리 코드는 앱 소스를 그대로 공유한다(아래 개별 파일 — UIKit 의존 없음).
  # Bundle ID 는 앱 ID 의 하위(…ios.nse), App Group·릴레이 주소는 앱과 **같은 값**을 빌드 설정으로 준다(xcodebuild 인자·xcconfig).
  FamilyChatNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: FamilyChatNSE
      - path: FamilyChat/Push/NotificationProcessor.swift
      - path: FamilyChat/Sync/SharedStorage.swift
      - path: FamilyChat/Sync/SeededEngineFactory.swift
      - path: FamilyChat/Engine/FfiEngine.swift
      - path: FamilyChat/Engine/DeviceIdentity.swift
      - path: FamilyChat/App/Strings.swift
      - path: ../ios-ffi/out/swift/FamilyMLS.swift
        group: Generated
    dependencies:
      - framework: ../ios-ffi/out/FamilyMLS.xcframework
        embed: false
      - package: FamilyMLSCore
    info:
      path: FamilyChatNSE/Info.plist
      properties:
        CFBundleDisplayName: 패밀리챗 알림
        CFBundleDevelopmentRegion: ko
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        FamilyChatRelayURL: $(FC_RELAY_URL)
        FamilyChatAppGroup: $(FC_APP_GROUP)
        # 봇 actor(쉼표 구분) — 알림 제목에 🤖
        FamilyChatAgentActors: $(FC_AGENT_ACTORS)
    # 서명 빌드용 자리 — 무서명 CI 에는 적용되지 않는다.
    entitlements:
      path: FamilyChatNSE/FamilyChatNSE.entitlements
      properties:
        com.apple.security.application-groups: [$(FC_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familychat.ios.nse
        TARGETED_DEVICE_FAMILY: "1"
        FC_RELAY_URL: ""
        FC_APP_GROUP: ""
        FC_AGENT_ACTORS: ""
        OTHER_LDFLAGS: ["-lc++"]
  FamilyChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamilyChatTests
    dependencies:
      - target: FamilyChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familychat.ios.tests
schemes:
  FamilyChat:
    build:
      targets:
        FamilyChat: all
        FamilyChatTests: [test]
    test:
      config: Debug
      targets: [FamilyChatTests]
