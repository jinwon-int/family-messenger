name: Isolated MLS browser experiment
on:
  push:
    branches: [main]
    paths: ['experiments/openmls-browser/**', 'experiments/device-keystore/**', 'tests/device_keystore_smoke.py', 'tests/password_worker_smoke.py', 'tests/session_record_smoke.py', 'tests/native_mls_browser_smoke.py', 'tests/native_lifecycle_checks.py', 'tests/native_identity_context_checks.py', 'tests/native_mls_persistence_smoke.py', 'tests/native_device_browser_smoke.py', 'tests/native_trusted_state_smoke.py', 'tests/native_encrypted_browser_smoke.py', 'tests/native_vault_checks.py', 'tests/native_vault_ui_checks.py', 'tests/native_history_checks.py', 'tests/fixtures/native-history/**', 'tests/fixtures/native-vault/**', 'tests/fixtures/aggregate-vault/**', 'tests/native_aggregate_smoke.py', 'tests/native_aggregate_binding_checks.py', 'tests/native_aggregate_checks.py', 'tests/native_aggregate_history_checks.py', 'tests/native_aggregate_history_ui_checks.py', 'tests/native_preparation_checks.py', 'tests/native_successor_peer_checks.py', 'tests/native_candidate_checks.py', 'tests/native_custody_checks.py', 'tests/custody_transport_checks.mjs', 'tests/native_aggregate_ui_checks.py', 'tests/native_chat_ui_checks.py', 'tests/native_asset_activation_smoke.py', 'tests/test_mls_assets.py', 'tools/prepare_mls_assets.py', 'server/**', '.github/workflows/mls-experiment.yml']
  pull_request:
    paths: ['experiments/openmls-browser/**', 'experiments/device-keystore/**', 'tests/device_keystore_smoke.py', 'tests/password_worker_smoke.py', 'tests/session_record_smoke.py', 'tests/native_mls_browser_smoke.py', 'tests/native_lifecycle_checks.py', 'tests/native_identity_context_checks.py', 'tests/native_mls_persistence_smoke.py', 'tests/native_device_browser_smoke.py', 'tests/native_trusted_state_smoke.py', 'tests/native_encrypted_browser_smoke.py', 'tests/native_vault_checks.py', 'tests/native_vault_ui_checks.py', 'tests/native_history_checks.py', 'tests/fixtures/native-history/**', 'tests/fixtures/native-vault/**', 'tests/fixtures/aggregate-vault/**', 'tests/native_aggregate_smoke.py', 'tests/native_aggregate_binding_checks.py', 'tests/native_aggregate_checks.py', 'tests/native_aggregate_history_checks.py', 'tests/native_aggregate_history_ui_checks.py', 'tests/native_preparation_checks.py', 'tests/native_successor_peer_checks.py', 'tests/native_candidate_checks.py', 'tests/native_custody_checks.py', 'tests/custody_transport_checks.mjs', 'tests/native_aggregate_ui_checks.py', 'tests/native_chat_ui_checks.py', 'tests/native_asset_activation_smoke.py', 'tests/test_mls_assets.py', 'tools/prepare_mls_assets.py', 'server/**', '.github/workflows/mls-experiment.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-mls:
    runs-on: ubuntu-latest
    # Prior exact-head run took ~23 minutes; new native history proof is bounded to 10 more.
    timeout-minutes: 35
    env:
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
    steps:
      - uses: actions/checkout@v4
      - name: Isolate tool and build paths
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/mls-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/mls-rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mls-target" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--cfg getrandom_backend=\"wasm_js\" --remap-path-prefix=$RUNNER_TEMP/mls-cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/workspace" >> "$GITHUB_ENV"
      - name: Restore pinned Rust toolchain and target caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/mls-cargo
            ${{ runner.temp }}/mls-rustup
            ${{ runner.temp }}/mls-target
          key: mls-rust-${{ runner.os }}-1.91.1-${{ hashFiles('experiments/openmls-browser/Cargo.lock') }}
      - name: Isolated pinned Rust and WASM target
        run: |
          rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
          rustup run 1.91.1 rustc --version
      - name: Build pinned library wrapper
        run: rustup run 1.91.1 cargo build --locked --release --target wasm32-unknown-unknown --manifest-path experiments/openmls-browser/Cargo.toml
      - name: Verify pinned binding generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.2.126 --repo wasm-bindgen/wasm-bindgen --pattern wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d  wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz' | sha256sum --check --strict
          tar xzf wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz
      - name: Generate browser assets
        run: |
          mkdir -p artifacts/mls-browser-pkg
          "$RUNNER_TEMP/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/family_mls_browser_experiment.wasm" --target web --out-dir artifacts/mls-browser-pkg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-native-test.txt
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements-native-test.txt') }}
      - name: Browser tooling
        run: |
          python -m pip install -r requirements-native-test.txt
          python -m playwright install --with-deps chromium
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build synthetic signed native admission
        run: |
          go -C server build -trimpath -o ../artifacts/family-dev-trust ./cmd/family-dev
          go -C server build -trimpath -o ../artifacts/family-policy-trust ./cmd/family-policy
      - name: Prepare and verify pinned compiled synthetic UI
        run: |
          python tools/prepare_mls_assets.py --bundle artifacts/mls-browser-pkg
          python tools/prepare_mls_assets.py --bundle artifacts/mls-browser-pkg --check
          python -m unittest discover -s tests -p test_mls_assets.py -v
          go -C server test -race -tags synthetic_mls ./...
          go -C server build -tags synthetic_mls -trimpath -o ../artifacts/family-dev-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --binary artifacts/family-dev-embedded --plain-binary artifacts/family-dev-trust
      - name: Own-server encrypted UI bytes and two-browser restart proof
        run: timeout 150s python tests/native_encrypted_browser_smoke.py --ui --embedded --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-embedded --policy-binary artifacts/family-policy-trust
      - name: Native directory and independently pinned browser devices
        run: timeout 120s python tests/native_device_browser_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Durable trusted clients and browser crash proof
        run: timeout 120s python tests/native_trusted_state_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Native encrypted delivery and durable browser outbox
        run: timeout 120s python tests/native_encrypted_browser_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Ordered native rekey and pending-commit recovery
        run: timeout 120s python tests/native_encrypted_browser_smoke.py --controls --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Own encrypted chat UI through two browsers
        run: timeout 150s python tests/native_encrypted_browser_smoke.py --ui --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Isolated pinned key-custody candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/device-keystore
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/probe.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/probe.js
          timeout 90s python tests/device_keystore_smoke.py --synthetic-only
      - name: Worker-only password archive and lifecycle feasibility
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/password-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/password-worker.js
          timeout 180s python tests/password_worker_smoke.py --synthetic-only
      - name: Authenticated worker session records
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/session-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/session-worker.js
          timeout 180s python tests/session_record_smoke.py --synthetic-only
      - name: Complete native state encrypted at rest
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/native-vault-store.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/native-vault-store.js
          timeout 240s python tests/native_encrypted_browser_smoke.py --vault --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
          timeout 240s python tests/native_encrypted_browser_smoke.py --vault --controls --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Aggregate custody container proof
        run: timeout 180s python tests/native_aggregate_smoke.py --synthetic-only
      - name: Encrypted custody UI and explicit read-only history UI
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/history-worker.js experiments/device-keystore/history-export-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify '--external:/pkg/*' --outdir=experiments/device-keystore/bundle
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild tests/fixtures/native-history/forge-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify '--external:/pkg/*' --alias:age-encryption=./experiments/device-keystore/node_modules/age-encryption --alias:libsodium-wrappers=./experiments/device-keystore/node_modules/libsodium-wrappers --outfile=artifacts/history-forge-worker.js
          timeout 420s python tests/native_encrypted_browser_smoke.py --vault-ui --history-ui --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Own-server pinned custody and historical recovery UI
        run: |
          python tools/prepare_mls_assets.py --vault --bundle artifacts/mls-browser-pkg
          python tools/prepare_mls_assets.py --vault --bundle artifacts/mls-browser-pkg --check
          go -C server test -race -tags synthetic_vault ./...
          go -C server build -tags synthetic_vault -trimpath -o ../artifacts/family-dev-vault-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --vault --binary artifacts/family-dev-vault-embedded --plain-binary artifacts/family-dev-trust
          python tools/prepare_mls_assets.py --history --bundle artifacts/mls-browser-pkg
          python tools/prepare_mls_assets.py --history --bundle artifacts/mls-browser-pkg --check
          go -C server test -race -tags synthetic_history ./...
          go -C server build -tags synthetic_history -trimpath -o ../artifacts/family-dev-history-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --history --binary artifacts/family-dev-history-embedded --plain-binary artifacts/family-dev-trust
          timeout 360s python tests/native_encrypted_browser_smoke.py --vault-ui --history-ui --embedded --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-history-embedded --policy-binary artifacts/family-policy-trust
      - name: Two disposable browsers
        run: |
          python tests/native_mls_browser_smoke.py --bundle artifacts/mls-browser-pkg
          timeout 90s python tests/native_mls_browser_smoke.py --lifecycle --bundle artifacts/mls-browser-pkg
      - name: Atomic synthetic state and browser crash proof
        run: timeout 120s python tests/native_mls_persistence_smoke.py --bundle artifacts/mls-browser-pkg
      - name: Isolated signer-only new conversation candidate
        run: |
          rustup run 1.91.1 cargo build --locked --release --target wasm32-unknown-unknown --features identity-context --manifest-path experiments/openmls-browser/Cargo.toml
          "$RUNNER_TEMP/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/family_mls_browser_experiment.wasm" --target web --out-dir artifacts/mls-identity-context-pkg
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/native-aggregate-vault.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/native-aggregate-vault.js
          timeout 120s python tests/native_mls_browser_smoke.py --identity-context --bundle artifacts/mls-identity-context-pkg --aggregate-store experiments/device-keystore/bundle/native-aggregate-vault.js
          timeout 120s python tests/native_aggregate_server_smoke.py --bundle artifacts/mls-identity-context-pkg --aggregate-store experiments/device-keystore/bundle/native-aggregate-vault.js --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
          timeout 300s python tests/native_aggregate_capacity.py --synthetic-only --seal-sample 64
      - name: Atomic encrypted two-conversation device custody
        run: timeout 480s python tests/native_encrypted_browser_smoke.py --aggregate --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Read-only complete aggregate history recovery
        run: timeout 480s python tests/native_encrypted_browser_smoke.py --aggregate-history --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Explicit read-only two-context archive UI
        run: timeout 480s python tests/native_encrypted_browser_smoke.py --aggregate-history-ui --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Own-server pinned protected aggregate chat
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/aggregate-store.js --bundle --format=esm --platform=browser --target=es2023 --minify '--external:/pkg/*' '--external:/trust-directory.js' --outfile=experiments/device-keystore/bundle/aggregate-store.js
          python tools/prepare_mls_assets.py --aggregate --bundle artifacts/mls-identity-context-pkg
          python tools/prepare_mls_assets.py --aggregate --bundle artifacts/mls-identity-context-pkg --check
          go -C server test -race -tags synthetic_aggregate ./...
          go -C server build -tags synthetic_aggregate -trimpath -o ../artifacts/family-dev-aggregate-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --aggregate --binary artifacts/family-dev-aggregate-embedded --plain-binary artifacts/family-dev-trust
          timeout 480s python tests/native_encrypted_browser_smoke.py --aggregate-ui --embedded --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-aggregate-embedded --policy-binary artifacts/family-policy-trust
      - name: Own-server immutable aggregate history and protected chat
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/aggregate-history-worker.js experiments/device-keystore/aggregate-history-export-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify '--external:/pkg/*' '--external:/trust-directory.js' --outdir=experiments/device-keystore/bundle
          python tools/prepare_mls_assets.py --aggregate-history --bundle artifacts/mls-identity-context-pkg
          python tools/prepare_mls_assets.py --aggregate-history --bundle artifacts/mls-identity-context-pkg --check
          go -C server test -race -tags 'synthetic_mls synthetic_vault synthetic_history synthetic_aggregate synthetic_aggregate_history' ./...
          go -C server build -tags synthetic_aggregate_history -trimpath -o ../artifacts/family-dev-aggregate-history-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --aggregate-history --binary artifacts/family-dev-aggregate-history-embedded --plain-binary artifacts/family-dev-trust
          timeout 600s python tests/native_encrypted_browser_smoke.py --aggregate-ui --embedded --aggregate-history-embedded --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-aggregate-history-embedded --policy-binary artifacts/family-policy-trust
      - name: Restricted intact-peer successor encrypted custody
        run: timeout 300s python tests/native_encrypted_browser_smoke.py --successor-peer --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Original uninstrumented successor custody worker
        run: timeout 180s python tests/native_encrypted_browser_smoke.py --successor-peer --successor-peer-original --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Protected inactive candidate proposal and custody
        run: timeout 300s python tests/native_encrypted_browser_smoke.py --candidate --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Original candidate custody worker
        run: timeout 180s python tests/native_encrypted_browser_smoke.py --candidate --candidate-original --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Two-device committed custody preparation barrier
        run: timeout 240s python tests/native_encrypted_browser_smoke.py --preparation --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Share exact-run custody proof inputs
        uses: actions/upload-artifact@v4
        with:
          name: custody-proof-inputs
          retention-days: 1
          path: |
            artifacts/mls-identity-context-pkg/
            artifacts/family-dev-trust
            artifacts/family-policy-trust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-mls-proof
          path: |
            artifacts/native-mls-browser-*/verification.json
            artifacts/native-mls-lifecycle-*/verification.json
            artifacts/native-identity-context-*/verification.json
            artifacts/native-mls-persistence-*/verification.json
            artifacts/native-device-browser-*/verification.json
            artifacts/native-trusted-state-*/verification.json
            artifacts/native-encrypted-browser-*/verification.json
            artifacts/native-aggregate-history-*/verification.json
            artifacts/native-aggregate-ui-*/verification.json
            artifacts/native-successor-peer-*/verification.json
            artifacts/native-candidate-*/verification.json
            artifacts/native-preparation-*/verification.json
            artifacts/native-aggregate-*/verification.json
            artifacts/native-control-browser-*/verification.json
            artifacts/native-chat-ui-*/verification.json
            artifacts/native-embedded-ui-*/verification.json
            artifacts/native-asset-activation-*/verification.json
            artifacts/device-keystore-*/verification.json
            artifacts/password-worker-*/verification.json
            artifacts/session-record-*/verification.json
            artifacts/native-vault-browser-*/verification.json
            artifacts/native-vault-control-*/verification.json
            artifacts/native-vault-ui-*/verification.json
            artifacts/native-history-*/verification.json

  paired-custody:
    needs: synthetic-mls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: custody-proof-inputs
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-native-test.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements-native-test.txt') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Install pinned browser and custody tooling
        run: |
          python -m pip install -r requirements-native-test.txt
          python -m playwright install --with-deps chromium
          npm --prefix experiments/device-keystore ci --ignore-scripts
          chmod 700 artifacts/family-dev-trust artifacts/family-policy-trust
      - name: Receipt deadlines and immutable retry identity
        run: node tests/custody_transport_checks.mjs
      - name: Paired protected stores in both orders and concurrently
        run: |
          for custody_order in candidate peer concurrent; do
            timeout 240s python tests/native_encrypted_browser_smoke.py --custody-order "$custody_order" --bundle artifacts/mls-identity-context-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-custody-proof
          path: artifacts/native-custody-*/verification.json
