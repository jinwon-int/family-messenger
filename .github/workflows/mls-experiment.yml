name: Isolated MLS browser experiment
on:
  push:
    paths: ['experiments/openmls-browser/**', 'experiments/device-keystore/**', 'tests/device_keystore_smoke.py', 'tests/password_worker_smoke.py', 'tests/native_mls_browser_smoke.py', 'tests/native_mls_persistence_smoke.py', 'tests/native_device_browser_smoke.py', 'tests/native_trusted_state_smoke.py', 'tests/native_encrypted_browser_smoke.py', 'tests/native_chat_ui_checks.py', 'tests/native_asset_activation_smoke.py', 'tests/test_mls_assets.py', 'tools/prepare_mls_assets.py', 'server/**', '.github/workflows/mls-experiment.yml']
  pull_request:
    paths: ['experiments/openmls-browser/**', 'experiments/device-keystore/**', 'tests/device_keystore_smoke.py', 'tests/password_worker_smoke.py', 'tests/native_mls_browser_smoke.py', 'tests/native_mls_persistence_smoke.py', 'tests/native_device_browser_smoke.py', 'tests/native_trusted_state_smoke.py', 'tests/native_encrypted_browser_smoke.py', 'tests/native_chat_ui_checks.py', 'tests/native_asset_activation_smoke.py', 'tests/test_mls_assets.py', 'tools/prepare_mls_assets.py', 'server/**', '.github/workflows/mls-experiment.yml']
permissions:
  contents: read
jobs:
  synthetic-mls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
    steps:
      - uses: actions/checkout@v4
      - name: Isolate tool and build paths
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/mls-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/mls-rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mls-target" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--cfg getrandom_backend=\"wasm_js\" --remap-path-prefix=$RUNNER_TEMP/mls-cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/workspace" >> "$GITHUB_ENV"
      - name: Isolated pinned Rust and WASM target
        run: |
          rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
          rustup run 1.91.1 rustc --version
      - name: Build pinned library wrapper
        run: rustup run 1.91.1 cargo build --locked --release --target wasm32-unknown-unknown --manifest-path experiments/openmls-browser/Cargo.toml
      - name: Verify pinned binding generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.2.126 --repo wasm-bindgen/wasm-bindgen --pattern wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d  wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz' | sha256sum --check --strict
          tar xzf wasm-bindgen-0.2.126-x86_64-unknown-linux-musl.tar.gz
      - name: Generate browser assets
        run: |
          mkdir -p artifacts/mls-browser-pkg
          "$RUNNER_TEMP/wasm-bindgen-0.2.126-x86_64-unknown-linux-musl/wasm-bindgen" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/family_mls_browser_experiment.wasm" --target web --out-dir artifacts/mls-browser-pkg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tooling
        run: |
          python -m pip install -r requirements-native-test.txt
          python -m playwright install --with-deps chromium
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build synthetic signed native admission
        run: |
          go -C server build -trimpath -o ../artifacts/family-dev-trust ./cmd/family-dev
          go -C server build -trimpath -o ../artifacts/family-policy-trust ./cmd/family-policy
      - name: Prepare and verify pinned compiled synthetic UI
        run: |
          python tools/prepare_mls_assets.py --bundle artifacts/mls-browser-pkg
          python tools/prepare_mls_assets.py --bundle artifacts/mls-browser-pkg --check
          python -m unittest discover -s tests -p test_mls_assets.py -v
          go -C server test -race -tags synthetic_mls ./...
          go -C server build -tags synthetic_mls -trimpath -o ../artifacts/family-dev-embedded ./cmd/family-dev
          python tests/native_asset_activation_smoke.py --binary artifacts/family-dev-embedded --plain-binary artifacts/family-dev-trust
      - name: Own-server encrypted UI bytes and two-browser restart proof
        run: timeout 150s python tests/native_encrypted_browser_smoke.py --ui --embedded --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-embedded --policy-binary artifacts/family-policy-trust
      - name: Native directory and independently pinned browser devices
        run: timeout 120s python tests/native_device_browser_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Durable trusted clients and browser crash proof
        run: timeout 120s python tests/native_trusted_state_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Native encrypted delivery and durable browser outbox
        run: timeout 120s python tests/native_encrypted_browser_smoke.py --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Ordered native rekey and pending-commit recovery
        run: timeout 120s python tests/native_encrypted_browser_smoke.py --controls --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - name: Own encrypted chat UI through two browsers
        run: timeout 150s python tests/native_encrypted_browser_smoke.py --ui --bundle artifacts/mls-browser-pkg --binary artifacts/family-dev-trust --policy-binary artifacts/family-policy-trust
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Isolated pinned key-custody candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix experiments/device-keystore
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/probe.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/probe.js
          timeout 90s python tests/device_keystore_smoke.py --synthetic-only
      - name: Worker-only password archive and lifecycle feasibility
        run: |
          node experiments/device-keystore/node_modules/esbuild/bin/esbuild experiments/device-keystore/password-worker.js --bundle --format=esm --platform=browser --target=es2023 --minify --outfile=experiments/device-keystore/bundle/password-worker.js
          timeout 180s python tests/password_worker_smoke.py --synthetic-only
      - name: Two disposable browsers
        run: python tests/native_mls_browser_smoke.py --bundle artifacts/mls-browser-pkg
      - name: Atomic synthetic state and browser crash proof
        run: timeout 120s python tests/native_mls_persistence_smoke.py --bundle artifacts/mls-browser-pkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-mls-proof
          path: |
            artifacts/native-mls-browser-*/verification.json
            artifacts/native-mls-persistence-*/verification.json
            artifacts/native-device-browser-*/verification.json
            artifacts/native-trusted-state-*/verification.json
            artifacts/native-encrypted-browser-*/verification.json
            artifacts/native-control-browser-*/verification.json
            artifacts/native-chat-ui-*/verification.json
            artifacts/native-embedded-ui-*/verification.json
            artifacts/native-asset-activation-*/verification.json
            artifacts/device-keystore-*/verification.json
            artifacts/password-worker-*/verification.json
