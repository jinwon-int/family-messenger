name: Native MLS track
# Native E2EE parallel track (#177). Budget: exactly 1 job, 25 minutes. Never re-enable
# the old 16-job mls-experiment fan-out.
# Required check on main: the job must REPORT on every pull_request and merge_group, so
# there is no workflow-level paths filter. The scope step below decides whether the
# heavy steps run; with no native-track change the job finishes green in seconds.
on:
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RUST_TOOLCHAIN: 1.91.1
  WASM_BINDGEN_VERSION: 0.2.126
  WASM_BINDGEN_SHA256: 064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d
jobs:
  native-mls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Scope — does this change touch the native track?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # Fail closed: any git error fails the job; it must never degrade to a silent skip.
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "event=$EVENT → full run"; exit 0 ;;
          esac
          [ -n "$base" ] || { echo "::error::no base sha for $EVENT"; exit 1; }
          git fetch --no-tags --depth=1 origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'changed files:\n%s\n' "$changed"
          # archive/ = the track itself; server/ + requirements = inputs of the trust-gate smokes.
          # here-string, not a pipe: with pipefail, grep -q exiting early would SIGPIPE printf.
          if grep -qE '^(archive/|server/|requirements-native-test\.txt$|\.github/workflows/native-mls\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "native track touched → full run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no native track change → skip heavy steps"
          fi
      - name: Pinned Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustc "+$RUST_TOOLCHAIN" --version
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archive/experiments/openmls-browser/target
          key: native-mls-cargo-${{ runner.os }}-${{ hashFiles('archive/experiments/openmls-browser/Cargo.lock') }}
      - name: Pinned wasm-bindgen CLI
        if: steps.scope.outputs.run == 'true'
        run: |
          curl -sSfL -o wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wb.tar.gz" | sha256sum -c
          tar xzf wb.tar.gz
          echo "MLS_WASM_BINDGEN=$PWD/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Build WASM bundle
        if: steps.scope.outputs.run == 'true'
        run: archive/experiments/openmls-browser/build.sh artifacts/mls-pkg
      # Host-target unit tests: storage v2 dirty set / rollback / 1,000-message
      # growth / format-1 migration (#177 M2), plus the trust checks.
      - name: Facade unit tests (cargo test, host)
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/experiments/openmls-browser
        run: cargo test --locked -- --nocapture
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            archive/native-mls/server/go.sum
      - name: Build live server binaries for the trust-gate smokes
        if: steps.scope.outputs.run == 'true'
        working-directory: server
        run: |
          go build -trimpath -o ../artifacts/family-dev ./cmd/family-dev
          go build -trimpath -o ../artifacts/family-policy ./cmd/family-policy
      # v2 relay (#177 §3.4) is its own Go module; cgo go-sqlite3 needs the runner's gcc.
      - name: v2 relay module — gofmt, vet, test
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/native-mls/server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go build -trimpath ./...
          go test -race -count=1 ./...
          go build -trimpath -o ../../../artifacts/native-mls-relay .
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-native-test.txt
      - name: Restore Playwright browser cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements-native-test.txt') }}
      - name: Install browser test tools
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -r requirements-native-test.txt
          python -m playwright install --with-deps chromium
      - name: Memory-only two-context roundtrip
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_mls_browser_smoke.py --bundle artifacts/mls-pkg
      - name: Staged IndexedDB persistence
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_mls_persistence_smoke.py --bundle artifacts/mls-pkg
      - name: First-device directory trust gate
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_device_browser_smoke.py --bundle artifacts/mls-pkg --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - name: Durable trusted state
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_trusted_state_smoke.py --bundle artifacts/mls-pkg --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - name: v2 relay client — 4 devices, fault injection a–g
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_v2_relay_smoke.py --bundle artifacts/mls-pkg --relay-binary artifacts/native-mls-relay
      - name: Preserve evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-mls-${{ github.event_name }}
          path: archive/artifacts/native-*/verification.json
