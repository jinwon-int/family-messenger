name: Native MLS track
# Native E2EE parallel track (#177). Budgets: browser track 1 job / 25 minutes;
# native bot (M5) 1 job / 15 minutes. Never re-enable the old 16-job
# mls-experiment fan-out.
# Required check on main: each job must REPORT on every pull_request and merge_group, so
# there is no workflow-level paths filter. The scope steps below decide whether the
# heavy steps run; with no native-track change the jobs finish green in seconds.
on:
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RUST_TOOLCHAIN: 1.91.1
  WASM_BINDGEN_VERSION: 0.2.126
  WASM_BINDGEN_SHA256: 064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d
jobs:
  native-mls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Scope — does this change touch the native track?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # Fail closed: any git error fails the job; it must never degrade to a silent skip.
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "event=$EVENT → full run"; exit 0 ;;
          esac
          [ -n "$base" ] || { echo "::error::no base sha for $EVENT"; exit 1; }
          git fetch --no-tags --depth=1 origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'changed files:\n%s\n' "$changed"
          # archive/ = the track itself; server/ + requirements = inputs of the trust-gate smokes.
          # here-string, not a pipe: with pipefail, grep -q exiting early would SIGPIPE printf.
          if grep -qE '^(archive/|server/|requirements-native-test\.txt$|\.github/workflows/native-mls\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "native track touched → full run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no native track change → skip heavy steps"
          fi
      # Real-device evidence validator (#177 §4, review batch 3): python + git only — no bundle,
      # no Playwright. Runs first so a validator regression fails in seconds, not after the build.
      - name: Real-device evidence validator selftest (python only)
        if: steps.scope.outputs.run == 'true'
        run: python3 archive/native-mls/tests/real_device_kit.py validate-selftest
      - name: Pinned Rust toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustc "+$RUST_TOOLCHAIN" --version
      - name: Cargo cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archive/experiments/openmls-browser/target
          key: native-mls-cargo-${{ runner.os }}-${{ hashFiles('archive/experiments/openmls-browser/Cargo.lock') }}
      - name: Pinned wasm-bindgen CLI
        if: steps.scope.outputs.run == 'true'
        run: |
          curl -sSfL -o wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wb.tar.gz" | sha256sum -c
          tar xzf wb.tar.gz
          echo "MLS_WASM_BINDGEN=$PWD/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      # Custody bundle (#177 M2b-3): age + libsodium from the pinned lock, bundled by build.sh.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archive/experiments/openmls-browser/package-lock.json
      - name: Custody bundle dependencies (npm ci)
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/experiments/openmls-browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      # H2 poison-message tombstone rule (#177): pure-function tests of session-store.js
      # (decision helper, ledger item shape, tagged encoding) — no wasm, no IndexedDB, seconds.
      - name: Session store unit tests (node --test)
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/experiments/openmls-browser
        run: node --test web/session-store.test.mjs
      - name: Build WASM bundle
        if: steps.scope.outputs.run == 'true'
        run: archive/experiments/openmls-browser/build.sh artifacts/mls-pkg
      # Reproducibility gate (#177 M2 / L5): drop only the facade crate's artefacts (deps stay
      # in the shared target dir, so this costs one crate compile + wasm-bindgen + esbuild),
      # rebuild into a second directory and require a byte-identical hash manifest.
      # TODO(#177): commit bundle-sha256.txt once the fleet build host matches CI; until then
      # the comparison against a committed manifest below is skipped when the file is absent.
      - name: Bundle reproducibility — second build must hash identically
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" clean --release --target wasm32-unknown-unknown \
            --manifest-path archive/experiments/openmls-browser/Cargo.toml -p family-mls-browser-experiment
          archive/experiments/openmls-browser/build.sh artifacts/mls-pkg-repro
          if ! diff artifacts/mls-pkg/bundle-sha256.txt artifacts/mls-pkg-repro/bundle-sha256.txt; then
            echo "::error::WASM bundle is not reproducible: second build produced different hashes"; exit 1
          fi
          echo "reproducible bundle manifest:"; cat artifacts/mls-pkg/bundle-sha256.txt
          committed=archive/experiments/openmls-browser/bundle-sha256.txt
          if [ -f "$committed" ]; then
            (cd artifacts/mls-pkg && sha256sum -c --strict "$GITHUB_WORKSPACE/$committed")
          else
            echo "no committed $committed yet (TODO #177) — manifest printed and uploaded only"
          fi
      # Host-target unit tests: storage v2 dirty set / rollback / 1,000-message
      # growth / format-1 migration (#177 M2), plus the trust checks.
      - name: Facade unit tests (cargo test, host)
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/experiments/openmls-browser
        run: cargo "+$RUST_TOOLCHAIN" test --locked -- --nocapture
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            archive/native-mls/server/go.sum
      - name: Build live server binaries for the trust-gate smokes
        if: steps.scope.outputs.run == 'true'
        working-directory: server
        run: |
          go build -trimpath -o ../artifacts/family-dev ./cmd/family-dev
          go build -trimpath -o ../artifacts/family-policy ./cmd/family-policy
      # v2 relay (#177 §3.4) is its own Go module; cgo go-sqlite3 needs the runner's gcc.
      - name: v2 relay module — gofmt, vet, test
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/native-mls/server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go build -trimpath ./...
          go test -race -count=1 ./...
          go build -trimpath -o ../../../artifacts/native-mls-relay .
          go build -trimpath -o ../../../artifacts/native-devices ./cmd/native-devices
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-native-test.txt
      - name: Restore Playwright browser cache
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements-native-test.txt') }}
      - name: Install browser test tools
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -r requirements-native-test.txt
          python -m playwright install --with-deps chromium
      - name: Memory-only two-context roundtrip
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_mls_browser_smoke.py --bundle artifacts/mls-pkg
      - name: Staged IndexedDB persistence
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_mls_persistence_smoke.py --bundle artifacts/mls-pkg
      - name: First-device directory trust gate
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_device_browser_smoke.py --bundle artifacts/mls-pkg --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - name: Durable trusted state
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_trusted_state_smoke.py --bundle artifacts/mls-pkg --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - name: v2 relay client — enrolled devices, fault injection a–i
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_v2_relay_smoke.py --bundle artifacts/mls-pkg --relay-binary artifacts/native-mls-relay --devices-binary artifacts/native-devices
      # M5: the native bot as a third leaf. Built here (not only in native-mls-bot)
      # because the smoke needs the wasm bundle + relay + devices this job already
      # has; the shared target dir keeps it incremental after the unit-test step.
      - name: Native MLS bot binary for the bot smoke
        if: steps.scope.outputs.run == 'true'
        working-directory: archive/native-mls/bot
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/archive/experiments/openmls-browser/target
        run: cargo "+$RUST_TOOLCHAIN" build --locked
      - name: v2 relay + native bot — 3-leaf room session, 256 KiB attachment, uninvited-room control
        if: steps.scope.outputs.run == 'true'
        run: python archive/native-mls/tests/native_mls_bot_smoke.py --bundle artifacts/mls-pkg --relay-binary artifacts/native-mls-relay --devices-binary artifacts/native-devices --bot-binary archive/experiments/openmls-browser/target/debug/native-mls-bot
      - name: Preserve evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-mls-${{ github.event_name }}
          path: |
            archive/artifacts/native-*/verification.json
            artifacts/mls-pkg/bundle-sha256.txt

  # M5 (#177 §7 Q3 답 1): the native MLS bot. A separate job so the browser
  # track keeps its single-job budget and wasm/npm caches untouched; hard cap
  # 15 minutes (M5 acceptance). The bot links the facade as a path dependency,
  # so facade changes gate this job too.
  native-mls-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scope — bot crate or facade dependency touched?
        id: bot-scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "event=$EVENT → full run"; exit 0 ;;
          esac
          [ -n "$base" ] || { echo "::error::no base sha for $EVENT"; exit 1; }
          git fetch --no-tags --depth=1 origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'changed files:\n%s\n' "$changed"
          if grep -qE '^(archive/native-mls/bot/|archive/experiments/openmls-browser/|\.github/workflows/native-mls\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "bot crate or facade touched → run"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no bot-relevant change → skip heavy steps"
          fi
      - name: Pinned Rust toolchain
        if: steps.bot-scope.outputs.run == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc "+$RUST_TOOLCHAIN" --version
      - name: Cargo cache
        if: steps.bot-scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archive/native-mls/bot/target
          key: native-mls-bot-cargo-${{ runner.os }}-${{ hashFiles('archive/native-mls/bot/Cargo.lock') }}
      - name: Bot unit tests (cargo test, host)
        if: steps.bot-scope.outputs.run == 'true'
        working-directory: archive/native-mls/bot
        run: cargo "+$RUST_TOOLCHAIN" test --locked -- --nocapture
