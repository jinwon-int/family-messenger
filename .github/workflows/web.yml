name: Web app
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # #510: a slow apt mirror may need most of the 20-minute install budget
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      # Dependency-free unit tests run before any install.
      - name: Unit tests
        run: npm test
      # package-lock.json is committed; npm ci installs exactly what it pins.
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: DOM smoke (happy-dom renders the main screens)
        run: npm run test:dom
      - name: Matrix SDK and Rust crypto smoke
        run: node tests/transport_smoke.mjs
      - name: Bundle app
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tools
        # #510: same apt stall as native.yml — `--with-deps` runs `sudo apt-get` that a
        # stalled mirror can hold for minutes (2026-10-26 the whole job hit its timeout
        # here and was cancelled). Wait for the dpkg lock, bound the root-side install with
        # a root `timeout`, clear leftovers and retry.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          py="$(command -v python)"
          for attempt in 1 2; do
            if timeout 150 "$py" -m pip install -r ../../requirements-native-test.txt \
               && timeout 150 "$py" -m playwright install chromium \
               && sudo timeout --kill-after=15 540 "$py" -m playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::browser test tool install attempt ${attempt} failed or stalled; clearing apt/dpkg and retrying"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::browser test tool install failed after 2 attempts"
          exit 1
      - name: Chromium login render and screenshot
        run: python tests/browser_smoke.py
      - name: Serve dist and probe app shell
        run: |
          set -euo pipefail
          node serve.mjs &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '패밀리챗'
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | grep -q '"lang"'
          curl -fsSI http://127.0.0.1:8080/manifest.webmanifest | grep -qi '^content-type: application/manifest'
          curl -fsSI http://127.0.0.1:8080/icons/icon.svg | grep -qi '^content-type: image/svg'
          # rust-crypto WASM asset must be reachable at the path the glue expects
          curl -fsSI http://127.0.0.1:8080/pkg/matrix_sdk_crypto_wasm_bg.wasm | grep -qi '^content-type: application/wasm'
          # 해시 파일명 번들·스타일이 존재하고 index.html이 그것을 참조해야 한다
          ls dist/main-*.js dist/styles-*.css dist/boot-*.js
          # 주석이 아니라 실제 참조 속성에서만 해시 이름을 찾는다
          grep -qE 'src="\./main-[A-Za-z0-9]{8}\.js"' dist/index.html
          grep -qE 'href="\./styles-[a-f0-9]{8}\.css"' dist/index.html
          grep -qE 'src="\./boot-[a-f0-9]{8}\.js"' dist/index.html
          test -f dist/sw.js && ! grep -q '__CACHE_NAME__\|__SHELL_ASSETS__' dist/sw.js
          # wasm이 SW 프리캐시 셸에 들어 있어야 매 배포마다 새 glue와 같은 빌드의 wasm이 쌍으로 내려온다
          grep -qF './pkg/matrix_sdk_crypto_wasm_bg.wasm' dist/sw.js
          test -f dist/config.json
          # 보안 헤더(CSP 등)와 해시 자산 immutable 캐시
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^cache-control: no-store'
          curl -fsSI "http://127.0.0.1:8080/$(ls dist | grep '^main-')" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          test -s dist/pkg/matrix_sdk_crypto_wasm_bg.wasm
      - name: Preserve bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist-${{ github.event_name }}
          path: web/app/dist
          if-no-files-found: ignore
      - name: Preserve browser render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-${{ github.event_name }}
          path: .runtime/web-browser-smoke
          if-no-files-found: ignore
