name: Native MLS track — Android host
# 독자 E2EE 트랙의 네 번째 호스트(Android) 스파이크 A (#338 §4). 예산: ubuntu 1 job ≤20분(결정 E 규칙 2).
# main 필수 체크가 아니므로 워크플로 수준 paths 필터. 운영 서버·실계정·비밀값 무관. macOS 불필요.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "archive/native-mls/ios-ffi/**"
      - "archive/native-mls/host-core/**"
      - "archive/native-mls/android/**"
      - ".github/workflows/native-mls-android.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RUST_TOOLCHAIN: 1.91.1
  CARGO_NDK_VERSION: 4.1.2
  SO_TOTAL_BYTES_MAX: 15728640   # 15 MiB — #338 §4 A 수용 기준
  # #366 3b JVM 왕복: Kotlin 컴파일러·JNA 는 정확 핀 + sha256(새 외부 의존 — Android 바인딩 런타임이 JNA 를 요구, #177 원칙 5).
  KOTLIN_VERSION: 2.1.20
  KOTLIN_SHA256: a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a
  JNA_VERSION: 5.17.0
  JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
  # B1.4: android/app/debug.keystore 인증서 SHA-256(openssl x509 -fingerprint). 키를 바꾸면 여기도 바꾼다.
  DEBUG_SIGNER_SHA256: 8f1b0baf7b4dc94e6833b765b299828407cc5008d539b7fb64fc7fb03bb70044
defaults:
  run:
    shell: bash
jobs:
  android-ffi:
    name: 3 ABI .so + Kotlin bindings (cargo-ndk, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: archive/native-mls/ios-ffi
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain + Android std targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustc "+$RUST_TOOLCHAIN" --version
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            archive/native-mls/ios-ffi/target
          key: native-mls-android-ffi-${{ runner.os }}-ndk${{ env.CARGO_NDK_VERSION }}-${{ hashFiles('archive/native-mls/ios-ffi/Cargo.lock') }}
      - name: cargo-ndk (pinned)
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q "$CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi
          cargo ndk --version
      - name: NDK on the runner
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build 3 ABI .so + Kotlin bindings — timed
        run: |
          start=$(date +%s)
          ./build-android.sh
          echo "android_build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          cat out/android/build-report.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Acceptance — 3/3 ABI present, total .so ≤ 15 MiB, Kotlin bindings generated
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do test -s "out/android/jniLibs/$abi/libfamily_mls_ios_ffi.so"; done
          total=$(sed -n 's/^total .so bytes: //p' out/android/build-report.txt)
          test "$total" -le "$SO_TOTAL_BYTES_MAX" || { echo "total .so $total > $SO_TOTAL_BYTES_MAX"; exit 1; }
          test "$(find out/android/kotlin -name '*.kt' | wc -l)" -ge 1
          grep -q 'package com.seoyoon_family.hande.mls' "$(find out/android/kotlin -name '*.kt' | head -1)"
      # ---- #366 3b: JVM(Linux) 왕복 — Kotlin 바인딩 + 호스트 어댑터 + in-memory 릴레이로 MlsRoom 두 기기 시나리오 ----
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin compiler + JNA (pinned, sha256) — cached
        id: jvm-tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jvm
          key: jvm-tools-kotlin${{ env.KOTLIN_VERSION }}-jna${{ env.JNA_VERSION }}
      - name: Kotlin compiler + JNA — download if not cached
        if: steps.jvm-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/jvm" && cd "$RUNNER_TEMP/jvm"
          curl -fsSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlin.zip" | sha256sum -c -
          unzip -q kotlin.zip && rm kotlin.zip
          curl -fsSL -o jna.jar "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${JNA_VERSION}/jna-${JNA_VERSION}.jar"
          echo "${JNA_SHA256}  jna.jar" | sha256sum -c -
      - name: JVM roundtrip — two MlsRoom devices over an in-memory relay (Linux host cdylib) — timed
        env:
          KOTLINC: ${{ runner.temp }}/jvm/kotlinc/bin/kotlinc
          JNA_JAR: ${{ runner.temp }}/jvm/jna.jar
          BINDINGS_DIR: out/android/kotlin
          FFI_LIB_DIR: target/debug
        run: |
          start=$(date +%s)
          ../android/scripts/jvm-roundtrip.sh 2>&1 | tee "$RUNNER_TEMP/jvm-roundtrip.log" | tail -n 30
          echo "jvm_roundtrip_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^ROUNDTRIP PASS' "$RUNNER_TEMP/jvm-roundtrip.log"
      - name: Upload spike artifacts (jniLibs · Kotlin · sha256 · report)
        uses: actions/upload-artifact@v4
        with:
          name: native-mls-android-ffi-${{ github.sha }}
          path: archive/native-mls/ios-ffi/out/android
          retention-days: 7
          if-no-files-found: error

  # ---- #338 B1: Compose 앱 골격 — 러너 내장 Android SDK + Gradle 8.11.1(KGP 2.1.20 ↔ AGP 8.7.2 호환표) + JDK 17. 바인딩·.so 는 위 job 아티팩트. ----
  android-app:
    name: Compose app assembleDebug (Gradle 8.11.1 · JDK 17 · runner SDK)
    needs: android-ffi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-mls-android-ffi-${{ github.sha }}
          path: ${{ runner.temp }}/ffi-out
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.11.1 (pinned, no wrapper jar in the repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: assembleDebug — timed
        working-directory: archive/native-mls/android
        run: |
          start=$(date +%s)
          test -d "$RUNNER_TEMP/ffi-out/kotlin" && test -d "$RUNNER_TEMP/ffi-out/jniLibs"
          gradle --no-daemon --console=plain -PhandeFfiOut="$RUNNER_TEMP/ffi-out" :app:assembleDebug 2>&1 | tail -n 80
          echo "app_build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: JVM unit tests (AppLogin 순수 로직, B2) · iOS↔Android DDL v1 동기 검사
        working-directory: archive/native-mls/android
        run: |
          gradle --no-daemon --console=plain -PhandeFfiOut="$RUNNER_TEMP/ffi-out" :app:testDebugUnitTest 2>&1 | tail -n 40
          n=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
          f=$(grep -ho 'failures="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "unit tests: $n run, $f failed" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$n" -ge 10 && test "$f" -eq 0
          scripts/check-ddl-sync.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Acceptance — APK exists · 3 ABI .so packaged · bindings compiled in
        working-directory: archive/native-mls/android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          echo "apk bytes: $(stat -c %s "$apk")" | tee -a "$GITHUB_STEP_SUMMARY"
          n=$(unzip -l "$apk" | grep -cE 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libfamily_mls_ios_ffi\.so$')
          test "$n" -eq 3 || { echo "expected 3 ABI .so in the APK, got $n"; unzip -l "$apk" | grep '\.so$'; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libjnidispatch.so' || { echo "JNA native missing"; exit 1; }
          # B1.4: 서명자 = 커밋된 app/debug.keystore(지문 고정). 러너 임시 키로 서명되면 실기기 재설치가 거부된다(2026-10-20 공융).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          got="$("$apksigner" verify --print-certs "$apk" | grep -oE 'SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $3}')"
          echo "signer sha256: $got" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$got" = "$DEBUG_SIGNER_SHA256" || { echo "APK signer $got != committed debug.keystore $DEBUG_SIGNER_SHA256"; exit 1; }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hande-android-debug-${{ github.sha }}
          path: archive/native-mls/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
