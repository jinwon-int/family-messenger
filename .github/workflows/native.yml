name: Native prototype
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify dependency content
        working-directory: server
        run: go mod download && go mod verify
      - name: Race and persistence tests
        working-directory: server
        run: |
          umask 022
          go test -race -count=1 ./...
          umask 077
          go test -count=1 ./...
          go vet ./...
      - name: Build standalone prototype
        working-directory: server
        run: |
          go build -trimpath -o ../artifacts/family-dev ./cmd/family-dev
          go build -trimpath -o ../artifacts/family-policy ./cmd/family-policy
      - name: Real process restart and stream proof
        run: python3 tests/native_smoke.py --binary artifacts/family-dev
      - name: Native media migration and crash proof
        run: python3 tests/native_media_smoke.py --binary artifacts/family-dev
      # The synthetic MLS transport smoke and the schema-8..11 successor probes
      # (pinned-source rebuilds + native_policy_smoke --successor*) left with the
      # native MLS freeze; see archive/native-mls/README.md.
      - name: Signed policy persistence and reload proof
        run: python3 tests/native_policy_smoke.py --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-native-test.txt
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements-native-test.txt') }}
      - name: Install browser test tools
        # 2026-10-03 merge-queue run of #250: `playwright install --with-deps`
        # stalled for 7m44s inside apt-get (fonts from the Azure Ubuntu mirror)
        # and tripped the 10-minute job timeout (#243). Bound each attempt and
        # retry instead of letting one stalled mirror fail the gate.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 150 python -m pip install -r requirements-native-test.txt \
               && timeout 150 python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::browser test tool install attempt ${attempt} failed or stalled; retrying"
            sleep 10
          done
          echo "::error::browser test tool install failed after 3 attempts"
          exit 1
      - name: Two real browser clients
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "::group::repeat $i/20"
            python tests/native_browser_smoke.py --binary artifacts/family-dev
            echo "::endgroup::"
            echo "repeat $i/20 PASS"
          done
      - name: Two browser media and playback proof
        run: python tests/native_media_browser_smoke.py --binary artifacts/family-dev
      - name: Signed identity browser handoff proof
        run: python tests/native_signed_browser_smoke.py --binary artifacts/family-dev --policy-binary artifacts/family-policy
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-${{ github.event_name }}
          path: |
            artifacts/native-signed-browser-*/verification.json
            artifacts/native-signed-browser-*/*.png
            artifacts/native-policy-*/verification.json
            artifacts/native-browser-*/verification.json
            artifacts/native-browser-*/*.png
            artifacts/native-media-browser-*/verification.json
            artifacts/native-media-browser-*/*.png
